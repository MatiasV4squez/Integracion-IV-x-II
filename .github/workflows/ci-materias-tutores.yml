name: CI Materias Tutores

on:
  push:
    branches: [feature/micro_materias_tutores]
  pull_request:
    branches: [feature/micro_materias_tutores]

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: materias-tutores

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: materias-tutores/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
