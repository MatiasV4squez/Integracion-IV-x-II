name: CI Frontend

on:
  push:
    branches: [Web]
  pull_request:
    branches: [Web]

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      VITE_API_BASE_URL: http://localhost:8080/api

    defaults:
      run:
        working-directory: fronted

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: fronted/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
