name: Build STP images

on:
  push:
    branches: [main]
    paths:
      - '2/**'
      - '.github/workflows/stp-build.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  construir:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        servicio:
          - usuarios-auth
          - materias-tutores
          - agendamiento-sesiones
          - reportes-moderacion
          - api-gateway
          - fronted

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Obtener propietario en minúsculas
        id: propietario
        run: echo "nombre=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Construir y publicar
        uses: docker/build-push-action@v7
        with:
          context: ./2/${{ matrix.servicio }}
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}
          tags: |
            ghcr.io/${{ steps.propietario.outputs.nombre }}/stp-${{ matrix.servicio }}:latest
            ghcr.io/${{ steps.propietario.outputs.nombre }}/stp-${{ matrix.servicio }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}