name: CI Usuarios Auth

on:
  push:
    branches: [feature/micro_usuarios_auth]
  pull_request:
    branches: [feature/micro_usuarios_auth]

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: usuarios-auth

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: usuarios-auth/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test -- --runInBand
