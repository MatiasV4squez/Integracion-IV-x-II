name: CI Agendamiento

on:
  push:
    branches: [feature/agendamiento_sesiones]
  pull_request:
    branches: [feature/agendamiento_sesiones]

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: agendamiento-sesiones

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: agendamiento-sesiones/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test -- --runInBand