name: CI

on:
  push:
    branches:
      - main
      - App
      - 'feature/**'
  pull_request:
    branches:
      - main
      - App

defaults:
  run:
    working-directory: proyect-app-studia

jobs:
  build-and-test:
    name: Lint, type-check y tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: proyect-app-studia/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Tests
        run: npm test
